##############################################################################
# NuCRM — Docker Compose (LOCAL DEVELOPMENT full stack)
#
# Runs the whole app (web + worker + infra) in Docker for local development.
# PRODUCTION does NOT use this file — production runs the app under PM2 and uses
# deploy/docker-compose.production.yml for infra/monitoring only.
# See deploy/DEPLOYMENT_PATHS.md.
##############################################################################

services:
  # ══════════════════════════════════════════════════════════════════════════
  # CORE SERVICES (start with: docker compose up -d)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Web Frontend (Next.js) ───────────────────────────────────────────────
  web:
    image: nucrm-enterprise-web:latest
    container_name: nucrm-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://nucrm:${POSTGRES_PASSWORD:?REQUIRED}@localhost:5432/nucrm?sslmode=require
      - REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SETUP_KEY=${SETUP_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=${NEXT_PUBLIC_APP_URL:?REQUIRED}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - NEXT_PUBLIC_APP_URL=http://34.70.191.180
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER}
      - BREVO_SMTP_PASS=${BREVO_SMTP_PASS}
      - S3_ENDPOINT=http://localhost:9000
      - S3_BUCKET=nucrm-files
      - S3_ACCESS_KEY=nucrm
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=us-east-1
      - NEXT_PUBLIC_S3_ENDPOINT=http://localhost:9000
      - NODE_OPTIONS=--max-old-space-size=2048
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Background Worker ───────────────────────────────────────────────────
  worker:
    image: nucrm-enterprise-worker:latest
    container_name: nucrm-worker
    command: ["node", "--import", "tsx", "worker.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nucrm:${POSTGRES_PASSWORD:?REQUIRED}@localhost:5432/nucrm?sslmode=require
      - REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SETUP_KEY=${SETUP_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    network_mode: host
    restart: unless-stopped

  # ── Realtime (socket.io + Redis) ──────────────────────────────────────────
  # Separate process because `next start` owns its own HTTP server and offers no
  # hook to attach socket.io. nginx proxies /socket.io/ here. Safe to scale: the
  # Redis adapter shares room membership across replicas. See issue #644.
  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "--import", "tsx", "realtime.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?REQUIRED}
      - SESSION_SECRET=${SESSION_SECRET:?REQUIRED}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?REQUIRED}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - REALTIME_PORT=4001
    expose:
      - "4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4001/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nucrm-db
    command:
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_duration=off"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nucrm}
      - POSTGRES_USER=${POSTGRES_USER:-nucrm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Restrict to localhost only for security
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nucrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── PgBouncer (Connection Pooler) ──────────────────────────────────────────
  # Sits between app and postgres. Transaction mode with pool_size=20.
  # App should connect to pgbouncer:6432 instead of postgres:5432.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nucrm-pgbouncer
    network_mode: host
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-nucrm}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-nucrm}
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=20
      - MAX_CLIENT_CONN=200
      - MAX_DB_CONNECTIONS=50
      - SERVER_RESET_QUERY=DISCARD ALL
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── MinIO (S3-compatible storage) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nucrm-s3
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=nucrm
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── MinIO Client (auto-create bucket on startup) ─────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: nucrm-s3-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 nucrm ${S3_SECRET_KEY:?REQUIRED} &&
      mc mb local/nucrm-files --ignore-existing &&
      echo 'MinIO bucket ready' &&
      exit 0
      "
    restart: no
    networks:
      - nucrm-net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nucrm-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ══════════════════════════════════════════════════════════════════════════
  # MONITORING (start with: docker compose --profile monitoring up -d)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nucrm-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: nucrm-grafana
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_HTTP_PORT=3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Loki ────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: nucrm-loki
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    command:
      - "--config.file=/etc/loki/loki-config.yml"
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Promtail ────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: nucrm-promtail
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
    command:
      - "--config.file=/etc/promtail/promtail-config.yml"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Alertmanager ────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nucrm-alertmanager
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanagerdata:/alertmanager
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - CRITICAL_ERROR_WEBHOOK_URL=${CRITICAL_ERROR_WEBHOOK_URL:-}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Node Exporter ───────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: nucrm-node-exporter
    profiles: ["monitoring"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Redis Exporter ──────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: nucrm-redis-exporter
    profiles: ["monitoring"]
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    ports:
      - "127.0.0.1:9121:9121"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── PostgreSQL Exporter ─────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: nucrm-postgres-exporter
    profiles: ["monitoring"]
    environment:
      - DATA_SOURCE_NAME=postgresql://nucrm:${POSTGRES_PASSWORD:?REQUIRED}@postgres:5432/nucrm?sslmode=require
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped
    networks:
      - nucrm-net

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  redisdata:
    driver: local
  promdata:
    driver: local
  grafdata:
    driver: local
  lokidata:
    driver: local
  alertmanagerdata:
    driver: local

networks:
  nucrm-net:
    driver: bridge
