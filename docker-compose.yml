##############################################################################
# NuCRM — Docker Compose (Full Stack)
##############################################################################

services:
  # ── Nginx Load Balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nucrm-lb
    ports:
      - "${NUCRM_PUBLIC_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nucrm-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Web Frontend (Next.js) ───────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: nucrm-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?REQUIRED}
      - SESSION_SECRET=${SESSION_SECRET:?REQUIRED}
      - SETUP_KEY=${SETUP_KEY:?REQUIRED}
      - CRON_SECRET=${CRON_SECRET:?REQUIRED}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?REQUIRED}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-nucrm-files}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-nucrm}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?REQUIRED}
      - S3_REGION=${S3_REGION:-us-east-1}
      - NEXT_PUBLIC_S3_ENDPOINT=${NEXT_PUBLIC_S3_ENDPOINT:-http://localhost:9000}
      - NODE_OPTIONS=--max-old-space-size=2048
    expose:
      - "3000"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Background Worker (BullMQ) ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "--import", "tsx", "worker.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?REQUIRED}
      - SESSION_SECRET=${SESSION_SECRET:?REQUIRED}
      - SETUP_KEY=${SETUP_KEY:?REQUIRED}
      - CRON_SECRET=${CRON_SECRET:?REQUIRED}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?REQUIRED}
      - DATABASE_SSL=${DATABASE_SSL:-true}
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Realtime (socket.io + Redis) ──────────────────────────────────────────
  # Separate process because `next start` owns its own HTTP server and offers no
  # hook to attach socket.io. nginx proxies /socket.io/ here. Safe to scale: the
  # Redis adapter shares room membership across replicas. See issue #644.
  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "--import", "tsx", "realtime.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?REQUIRED}
      - SESSION_SECRET=${SESSION_SECRET:?REQUIRED}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?REQUIRED}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - REALTIME_PORT=4001
    expose:
      - "4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4001/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nucrm-db
    command:
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_duration=off"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nucrm}
      - POSTGRES_USER=${POSTGRES_USER:-nucrm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Restrict to localhost only for security
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nucrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── PgBouncer (Connection Pooler) ──────────────────────────────────────────
  # Sits between app and postgres. Transaction mode with pool_size=20.
  # App should connect to pgbouncer:6432 instead of postgres:5432.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: nucrm-pgbouncer
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-nucrm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nucrm}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=20
      - MAX_CLIENT_CONN=200
      - MAX_DB_CONNECTIONS=50
      - SERVER_RESET_QUERY=DISCARD ALL
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Loki (Log Aggregation) ──────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: nucrm-loki
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    command:
      - "--config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nucrm-alertmanager
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanagerdata:/alertmanager
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - CRITICAL_ERROR_WEBHOOK_URL=${CRITICAL_ERROR_WEBHOOK_URL:-}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Promtail (Log Shipper) ───────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: nucrm-promtail
    volumes:
      - ./deploy/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
    command:
      - "--config.file=/etc/promtail/promtail-config.yml"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── MinIO (S3-compatible storage) ─────────────────────────────────────────
  # DEV/LOCAL ONLY. MinIO is a single-instance S3-compatible store for
  # development. In production, use a managed object-storage service (AWS S3,
  # Cloudflare R2, or any S3-compatible provider) — the app speaks the standard
  # S3 API via @aws-sdk/client-s3 and connects to whatever S3_ENDPOINT is set.
  # The MinIO single-instance is NOT production-grade: no replication, no
  # cross-region, and a disk failure loses every uploaded file.
  minio:
    image: minio/minio:latest
    container_name: nucrm-s3
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-nucrm}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:?REQUIRED}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── MinIO Client (auto-create bucket on startup) ─────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: nucrm-s3-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-nucrm} ${S3_SECRET_KEY:?REQUIRED} &&
      mc mb local/${S3_BUCKET:-nucrm-files} --ignore-existing &&
      echo 'MinIO bucket ready' &&
      exit 0
      "
    restart: no
    networks:
      - nucrm-net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nucrm-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      # Restrict to localhost only for security
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  lokidata:
    driver: local
  alertmanagerdata:
    driver: local
  miniodata:
    driver: local

networks:
  nucrm-net:
    driver: bridge
