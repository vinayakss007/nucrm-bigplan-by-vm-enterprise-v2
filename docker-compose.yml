##############################################################################
# NuCRM — Docker Compose (Production Stack)
##############################################################################

services:
  # ══════════════════════════════════════════════════════════════════════════
  # CORE SERVICES (start with: docker compose up -d)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Web Frontend (Next.js) ───────────────────────────────────────────────
  web:
    image: nucrm-enterprise-web:latest
    container_name: nucrm-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://nucrm:nucrm_prod_db_pass_2026@localhost:5432/nucrm?sslmode=disable
      - REDIS_URL=redis://:dacaf6be257062d9839bf9cacbbaccd237df7649335acad5@localhost:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SETUP_KEY=${SETUP_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=http://34.70.191.180
      - COOKIE_SECURE=false
      - NEXT_PUBLIC_APP_URL=http://34.70.191.180
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER}
      - BREVO_SMTP_PASS=${BREVO_SMTP_PASS}
      - S3_ENDPOINT=http://localhost:9000
      - S3_BUCKET=nucrm-files
      - S3_ACCESS_KEY=nucrm
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=us-east-1
      - NEXT_PUBLIC_S3_ENDPOINT=http://localhost:9000
      - NODE_OPTIONS=--max-old-space-size=2048
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Background Worker ───────────────────────────────────────────────────
  worker:
    image: nucrm-enterprise-worker:latest
    container_name: nucrm-worker
    command: ["node", "--import", "tsx", "worker.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nucrm:nucrm_prod_db_pass_2026@localhost:5432/nucrm?sslmode=disable
      - REDIS_URL=redis://:dacaf6be257062d9839bf9cacbbaccd237df7649335acad5@localhost:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SETUP_KEY=${SETUP_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    network_mode: host
    restart: unless-stopped

  # ── MinIO (S3-compatible storage) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nucrm-s3
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=nucrm
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── MinIO Client (auto-create bucket on startup) ─────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: nucrm-s3-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 nucrm ${S3_SECRET_KEY:?REQUIRED} &&
      mc mb local/nucrm-files --ignore-existing &&
      echo 'MinIO bucket ready' &&
      exit 0
      "
    restart: no
    networks:
      - nucrm-net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nucrm-redis
    command: >
      redis-server
      --requirepass dacaf6be257062d9839bf9cacbbaccd237df7649335acad5
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dacaf6be257062d9839bf9cacbbaccd237df7649335acad5", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - nucrm-net

  # ══════════════════════════════════════════════════════════════════════════
  # MONITORING (start with: docker compose --profile monitoring up -d)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nucrm-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: nucrm-grafana
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_HTTP_PORT=3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Loki ────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: nucrm-loki
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    command:
      - "--config.file=/etc/loki/loki-config.yml"
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Promtail ────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: nucrm-promtail
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
    command:
      - "--config.file=/etc/promtail/promtail-config.yml"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Alertmanager ────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nucrm-alertmanager
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanagerdata:/alertmanager
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - CRITICAL_ERROR_WEBHOOK_URL=${CRITICAL_ERROR_WEBHOOK_URL:-}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Node Exporter ───────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: nucrm-node-exporter
    profiles: ["monitoring"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── Redis Exporter ──────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: nucrm-redis-exporter
    profiles: ["monitoring"]
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=dacaf6be257062d9839bf9cacbbaccd237df7649335acad5
    depends_on:
      - redis
    ports:
      - "127.0.0.1:9121:9121"
    restart: unless-stopped
    networks:
      - nucrm-net

  # ── PostgreSQL Exporter ─────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: nucrm-postgres-exporter
    profiles: ["monitoring"]
    environment:
      - DATA_SOURCE_NAME=postgresql://nucrm:nucrm_prod_db_pass_2026@localhost:5432/nucrm?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped
    networks:
      - nucrm-net

volumes:
  miniodata:
    driver: local
  redisdata:
    driver: local
  promdata:
    driver: local
  grafdata:
    driver: local
  lokidata:
    driver: local
  alertmanagerdata:
    driver: local

networks:
  nucrm-net:
    driver: bridge
