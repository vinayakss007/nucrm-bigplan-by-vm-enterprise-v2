name: "✨ Feature request"
description: "Propose a new capability or enhancement."
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: "What user or business problem does this solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: "What should the behavior be? Include API/UX shape if relevant."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Other approaches, and why this one."
    validations:
      required: false
  - type: dropdown
    id: effort
    attributes:
      label: Rough effort
      options:
        - "Small"
        - "Medium"
        - "Large"
    validations:
      required: false
