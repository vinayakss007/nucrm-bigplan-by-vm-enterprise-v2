name: Deploy

# Runs only after the CI workflow has gone green for a commit on main.
#
# This used to trigger directly on `push: [main]` and re-run its own truncated
# copy of CI before deploying: `npm test`, then lint, then build. `npm test` is
# `vitest run`, i.e. every suite including tests/integration -- but this job has
# no postgres service, no redis service and none of the env CI sets, so those
# suites could not pass here. The result was 387 runs and zero successes: the
# workflow never reached the Docker build, and nothing was ever deployed.
#
# CI already runs lint, typecheck, unit tests, integration tests, secret scan,
# SAST and build on every push to main, with the services those need. So rather
# than reproduce a subset of it badly, wait for it and deploy the commit it
# passed on.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  HEALTH_CHECK_RETRIES: 12
  HEALTH_CHECK_INTERVAL: 10

jobs:
  deploy:
    name: Build & Deploy
    # workflow_run fires on failure too, so this guard is what makes the gate real.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # github.sha is not the commit CI tested, so pin everything to head_sha.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/vinayak_shruti_biz

            echo "Pulling new image..."
            docker compose pull app

            echo "Starting rolling update..."
            docker compose up -d --no-deps --scale app=2 --no-recreate app

            echo "Waiting for new container health check..."
            NEW_CONTAINER=""
            HEALTHY=""
            for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
              NEW_CONTAINER=$(docker compose ps -q app | tail -1)
              if [ -n "$NEW_CONTAINER" ]; then
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_CONTAINER" 2>/dev/null || echo "starting")
                if [ "$STATUS" = "healthy" ]; then
                  HEALTHY="yes"
                  echo "New container healthy after ${i}x${{ env.HEALTH_CHECK_INTERVAL }}s"
                  break
                fi
              fi
              sleep ${{ env.HEALTH_CHECK_INTERVAL }}
            done

            # Gate on health, not on existence. This used to test -z "$NEW_CONTAINER",
            # which is empty only if `docker compose ps -q` returned nothing at all --
            # so a container that started and stayed unhealthy, or never passed its
            # healthcheck within the timeout, counted as a successful deploy and the
            # old healthy container was then stopped underneath it.
            if [ -z "$HEALTHY" ]; then
              echo "ERROR: new container did not become healthy. Rolling back."
              docker compose up -d --no-deps --scale app=1 app
              exit 1
            fi

            echo "Stopping old container..."
            OLD_CONTAINER=$(docker compose ps -q app | head -1)
            docker stop "$OLD_CONTAINER" 2>/dev/null || true
            docker compose up -d --no-deps --scale app=1 app

            echo "Cleaning up..."
            docker container prune -f
            docker image prune -f

            echo "Deploy complete: ${{ github.event.workflow_run.head_sha }}"
