name: Deploy

# Runs only after the CI workflow has gone green for a commit on main.
#
# The app on the production VM runs via pm2 (`web`, `next start` on
# port 3000 behind nginx), not Docker. In production, Docker is used only for
# the monitoring/infra stack (prometheus/grafana/promtail/alertmanager, redis,
# minio) — see deploy/DEPLOYMENT_PATHS.md. Docker-based full-stack runs are for
# LOCAL DEVELOPMENT only (root docker-compose.yml). This deploy is therefore a
# git-based pm2 update, never a Docker image rollout.
#
# The deploy is a git-based update on the VM: fetch the exact commit CI
# tested, install deps, build, restart pm2, gate on the health endpoint,
# and roll back to the previous commit if the new build is unhealthy.
#
# MAIN IS THE ONLY SOURCE OF TRUTH: the job checks out the exact commit CI
# verified on main. It never deploys a git tag, a GitHub release asset, or a
# Docker image, so the VM always runs the latest code on main. Release tags
# (v0.9.x) and the local-dev docker-compose.slim.yml have no effect on what
# gets deployed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  HEALTH_CHECK_RETRIES: 12
  HEALTH_CHECK_INTERVAL: 10
  # Health endpoints to try, in order: 3099 is the production 'nucrm-prod'
  # port, 3000 is the ecosystem.config.cjs 'web' port. Trying both keeps the
  # gate honest if the live port ever moves.
  HEALTH_PORTS: 3099 3000
  # The commit to deploy. Normal path: the exact commit CI verified on main.
  # Manual path: a workflow_dispatch run has no workflow_run payload, so fall
  # back to github.sha — the head of the branch dispatched (main by default).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy
    # workflow_run fires on failure too, so this guard is what makes the gate
    # real. A manual workflow_dispatch has no workflow_run payload (null
    # conclusion), so it must pass the guard explicitly instead of being
    # skipped — otherwise "Run workflow" from the Actions tab does nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # github.sha is not the commit CI tested, so pin everything to DEPLOY_SHA
      # (workflow_run.head_sha, falling back to github.sha for manual runs).
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # NOTE (#1425): production runs the app under PM2 via a git-based update
      # (below), NOT from a Docker image. The previous ghcr build/push steps
      # contradicted that and produced an image nothing consumed, so they are
      # removed. Docker is used for local development only.

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # npm ci + next build (with typecheck) on the 2-CPU VM takes
          # ~25-30 min; the 10m default and even 30m were too short.
          command_timeout: 60m
          script: |
            set -e
            cd /home/vinayak_shruti_biz/nucrm-bigplan-by-vm-enterprise-v2

            # Non-interactive SSH does not source .bashrc, so the nvm
            # toolchain (node/npm/pm2) is not on PATH. Load it explicitly.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            SHA="${{ env.DEPLOY_SHA }}"
            if [ -z "$SHA" ]; then
              echo "ERROR: no deploy SHA resolved (DEPLOY_SHA is empty)."
              exit 1
            fi
            echo "Deploying main commit: $SHA"

            # The pm2 app name is not stable across hosts/rewrites: production
            # has been 'nucrm-prod' (next start -p 3099) while
            # ecosystem.config.cjs declares 'web' (PORT=3000). Restart whichever
            # process actually exists; a name mismatch used to fail the deploy.
            PM2_APP=""
            for candidate in nucrm-prod web; do
              if pm2 describe "$candidate" >/dev/null 2>&1; then
                PM2_APP="$candidate"
                break
              fi
            done
            if [ -z "$PM2_APP" ]; then
              echo "No pm2 app found — starting it from ecosystem.config.cjs"
              pm2 start ecosystem.config.cjs --only web
              pm2 save
              PM2_APP="web"
            fi
            echo "Using pm2 app: $PM2_APP"

            # Probe both known ports so a port move (3000 <-> 3099) can never
            # turn a healthy deploy into a false rollback.
            HEALTH_PORTS="${{ env.HEALTH_PORTS }}"

            # Restart + wait for the health endpoint. Gate on the endpoint, not
            # on process existence: pm2 can report "online" while the app fails
            # to serve.
            #
            # #2273 — health 200 is necessary but not sufficient: if the pm2
            # "web" process ever drifted to `next dev` (someone started it by
            # hand, pm2 save persisted it, and restart reuses those args), the
            # app serves readable per-module source chunks, 200s .js.map files
            # and a live HMR endpoint — full source disclosure to anonymous
            # visitors — while /api/health stays green. Discriminator:
            # `next start` answers 404 on /_next/webpack-hmr; a dev server
            # answers 200 or holds the connection open (curl -> 000). Anything
            # but 404 means a dev server is exposed on the app port: fail the
            # gate rather than certify the leak.
            dev_server_exposed() {
              DEV_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 4 \
                "http://127.0.0.1:$1/_next/webpack-hmr" || echo "000")
              [ "$DEV_CODE" != "404" ]
            }

            restart_and_wait() {
              pm2 restart "$PM2_APP" --update-env
              pm2 save
              LAST_STATUS="no response"
              for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
                for PORT in $HEALTH_PORTS; do
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                    "http://127.0.0.1:$PORT/api/health" || echo "000")
                  if [ "$STATUS" = "200" ]; then
                    if dev_server_exposed "$PORT"; then
                      echo "ABORT: port $PORT answers /_next/webpack-hmr with $DEV_CODE — that is a DEV-mode"
                      echo "Next.js server on the app port (#2273: source chunks, .js.map 200s, HMR live)."
                      echo "pm2 app $PM2_APP is not running 'next start'; fix its start command (see"
                      echo "ecosystem.config.cjs) and pm2 save, then re-run the deploy."
                      return 1
                    fi
                    echo "App healthy on port $PORT after ${i}x${{ env.HEALTH_CHECK_INTERVAL }}s (prod-mode probe: 404 on HMR)"
                    return 0
                  fi
                  LAST_STATUS="port $PORT returned $STATUS"
                done
                echo "Attempt $i: $LAST_STATUS"
                sleep ${{ env.HEALTH_CHECK_INTERVAL }}
              done
              return 1
            }

            # #2300 — ecosystem.config.cjs declares three apps (web, worker,
            # cron); this step used to restart only web. Every merge touching
            # worker.ts, lib/automation/**, job handlers or scripts/
            # cron-scheduler.ts shipped web-only: the OLD worker kept consuming
            # NEW queue payloads with old logic (mixed-version processing —
            # wrong plan emails, stale follow-ups, jobs that silently fail or
            # duplicate), and it was invisible because the web health endpoint
            # stayed green. Same for a cron stuck in "errored" (the documented
            # FATAL: CRON_SECRET class of silent death — no gate noticed).
            BG_APPS="worker cron"
            restart_background_apps() {
              for APP in $BG_APPS; do
                if pm2 describe "$APP" >/dev/null 2>&1; then
                  echo "Restarting pm2 app $APP onto $SHA"
                  pm2 restart "$APP" --update-env
                else
                  echo "pm2 app $APP missing — starting it from ecosystem.config.cjs onto $SHA"
                  pm2 start ecosystem.config.cjs --only "$APP"
                fi
              done
              pm2 save
            }

            # worker/cron serve no HTTP endpoint, so their gate is the pm2
            # status: "online" within the retry budget passes; "errored" fails
            # immediately instead of burning the whole window.
            bg_gate() {
              for APP in $BG_APPS; do
                OK=0
                for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
                  BG_STATUS=$(pm2 jlist 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const l=JSON.parse(d);const a=l.find(x=>x.name===process.argv[1]);process.stdout.write(a?a.pm2_env.status:"missing")}catch{process.stdout.write("parse-error")}})' "$APP")
                  if [ "$BG_STATUS" = "online" ]; then
                    echo "$APP online (attempt $i)"
                    OK=1
                    break
                  fi
                  if [ "$BG_STATUS" = "errored" ]; then
                    echo "$APP is ERRORED — process died on start (check its env: ecosystem.config.cjs notes)"
                    break
                  fi
                  echo "Attempt $i: $APP status=$BG_STATUS"
                  sleep ${{ env.HEALTH_CHECK_INTERVAL }}
                done
                if [ "$OK" != "1" ]; then
                  echo "FAIL: background consumer $APP did not reach online (last status: $BG_STATUS)"
                  pm2 describe "$APP" 2>&1 | tail -25 || true
                  return 1
                fi
              done
              return 0
            }

            # One unit of work for BOTH the forward deploy and the rollback:
            # web must be healthy first (a broken web must not have its
            # consumers churned), then worker+cron are restarted and gated.
            deploy_all_and_wait() {
              restart_and_wait || return 1
              restart_background_apps
              bg_gate
            }

            echo "Fetching latest code..."
            git fetch origin main
            git checkout --force "$SHA"
            echo "Checked out $SHA"

            echo "Installing dependencies..."
            npm ci --no-audit --no-fund

            # #2306 — RLS invariant gate, BEFORE anything is restarted. A role
            # that is a superuser or has BYPASSRLS makes every tenant_isolation
            # policy a no-op, and that is decided entirely by DATABASE_URL: one
            # edited value (a restore pointed at the local `postgres` superuser,
            # say) silently disables isolation for every paying customer while
            # every test stays green. scripts/check-db-role-privileges.mjs is the
            # same assertion the startup guard and the nightly use (single source
            # of truth: lib/db/least-privilege.ts), it reads metadata only, and it
            # never prints the connection string.
            echo "Checking DB role privileges: the connecting role must be subject to RLS (#2306)..."
            if ! npx tsx scripts/check-db-role-privileges.mjs; then
              echo "ABORT: the role behind this host's DATABASE_URL can bypass RLS"
              echo "(superuser / BYPASSRLS / owner of un-FORCE'd tenant tables)."
              echo "Tenant isolation would be a no-op for the app about to be restarted."
              echo "Provision a least-privilege role (npm run db:provision-app-role) and point"
              echo "DATABASE_URL at it, then re-run the deploy. Nothing was restarted."
              exit 1
            fi
            echo "DB role is RLS-constrained — safe to build and restart."

            # #2233 — the deploy MUST migrate the schema between checkout and
            # build/restart. Until now migrations ran only by hand on the host,
            # so merging a migration+code PR shipped code against an unmigrated
            # schema while the health gate stayed green (schema_ready checks 10
            # base tables — blind to new columns), and rollback was code-only:
            # old code on new schema. Discipline assumed here (and the reason
            # the FAIL path un-applies): every migration in a release chain
            # must be additive-compatible with the still-running previous
            # release, because the OLD app keeps serving until restart.
            #
            # Steps: snapshot the applied list, take a schema-only restore
            # point (refuse to migrate without one), run db:migrate
            # non-interactively, and on failure un-apply exactly the
            # migrations THIS deploy added — before anything is restarted.
            list_applied() {
              npx tsx --import ./scripts/load-env.mjs scripts/rollback-migration.ts --list \
                | awk '/^ +[0-9]+ /{print $2}'
            }
            PRE_APPLIED=$(list_applied)
            echo "Schema head before migration: $(echo "$PRE_APPLIED" | head -1)"

            BACKUP_DIR=/tmp/nucrm-backups
            mkdir -p "$BACKUP_DIR"
            STAMP=$(date +%Y%m%dT%H%M%S)
            RESTORE_POINT="$BACKUP_DIR/schema-pre-${SHA:0:8}-${STAMP}.sql.gz"
            DB_URL=$(node -e 'const fs=require("fs");const m=fs.readFileSync(".env.local","utf8").match(/^DATABASE_URL="?([^"\n]+)/m);process.stdout.write(m?m[1]:"")')
            if [ -z "$DB_URL" ]; then
              echo "ABORT: DATABASE_URL not found in .env.local — cannot migrate or back up (#2233)"
              exit 1
            fi
            # pg_dump lives on the host only if postgres client tools are
            # installed; the nucrm-db container always has a matching client.
            if command -v pg_dump >/dev/null 2>&1; then
              pg_dump --schema-only --no-privileges --no-owner "$DB_URL" | gzip > "$RESTORE_POINT"
            else
              docker exec nucrm-db pg_dump --schema-only --no-privileges --no-owner "$DB_URL" | gzip > "$RESTORE_POINT"
            fi
            if [ ! -s "$RESTORE_POINT" ]; then
              echo "ABORT: pre-migrate schema backup failed — refusing to migrate without a restore point (#2233)"
              rm -f "$RESTORE_POINT"
              exit 1
            fi
            echo "Schema restore point: $RESTORE_POINT"
            ls -t "$BACKUP_DIR"/schema-pre-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm -f

            echo "Running migrations (db:migrate, non-interactive)..."
            if ! npx tsx --import ./scripts/load-env.mjs scripts/migrate.ts --yes; then
              echo "ERROR: migration failed — un-applying what THIS deploy added, before restarting anything."
              POST_APPLIED=$(list_applied)
              for TAG in $(comm -13 <(echo "$PRE_APPLIED" | sort) <(echo "$POST_APPLIED" | sort) | sort -r); do
                echo "Un-applying $TAG"
                npx tsx --import ./scripts/load-env.mjs scripts/rollback-migration.ts "$TAG" --yes \
                  || echo "WARNING: un-apply of $TAG failed — schema is MIXED; restore point: $RESTORE_POINT"
              done
              exit 1
            fi
            POST_APPLIED=$(list_applied)
            APPLIED_NOW=$(comm -13 <(echo "$PRE_APPLIED" | sort) <(echo "$POST_APPLIED" | sort) | sort -r)
            echo "Migrations applied by this deploy: $(echo "$APPLIED_NOW" | grep -c .)"

            echo "Building..."
            NODE_OPTIONS="--max-old-space-size=8192" npm run build

            echo "Restarting app (pm2: $PM2_APP) + background consumers ($BG_APPS)..."
            if deploy_all_and_wait; then
              # The deploy host is also the dev host; leave the repo on main
              # instead of a detached HEAD. The running app keeps serving the
              # built artifacts from the deployed commit.
              git checkout main
              echo "Deploy complete: $SHA (pm2 apps restarted: $PM2_APP, worker, cron)"
              exit 0
            fi

            echo "ERROR: app did not become healthy. Rolling back to previous commit."
            git checkout --force "$SHA"^
            # #2233 — a code-only rollback recreates the very drift this issue
            # is about (old code on the NEW schema). Un-apply the migrations
            # this deploy added, newest first, so the schema matches the code
            # going back. Failures are loud, never silent: the restore point
            # printed above is the manual path.
            if [ -n "$APPLIED_NOW" ]; then
              for TAG in $APPLIED_NOW; do
                echo "Rolling back migration $TAG (deploy was unhealthy)"
                npx tsx --import ./scripts/load-env.mjs scripts/rollback-migration.ts "$TAG" --yes \
                  || echo "WARNING: rollback of $TAG failed — schema stays at NEW state; restore point for manual recovery."
              done
            fi
            NODE_OPTIONS="--max-old-space-size=8192" npm run build
            # #2300: rollback reverses ALL three apps, not just web — otherwise
            # the old web returns while worker/cron keep running new code.
            if deploy_all_and_wait; then
              echo "Rollback healthy."
            else
              echo "WARNING: rollback did not pass the health gate either."
            fi
            git checkout main
            exit 1
