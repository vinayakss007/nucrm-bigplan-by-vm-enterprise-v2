name: Deploy

# Runs only after the CI workflow has gone green for a commit on main.
#
# The app on the production VM runs via pm2 (`nucrm-prod`, `next start` on
# port 3099 behind nginx), not Docker. Docker hosts only the monitoring stack
# (prometheus/grafana/promtail/alertmanager). A Docker-image-based rolling
# update therefore can never deploy the app, and the compose file has no
# `app` service at all.
#
# The deploy is a git-based update on the VM: fetch the exact commit CI
# tested, install deps, build, restart pm2, gate on the health endpoint,
# and roll back to the previous commit if the new build is unhealthy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  HEALTH_CHECK_RETRIES: 12
  HEALTH_CHECK_INTERVAL: 10

jobs:
  deploy:
    name: Build & Deploy
    # workflow_run fires on failure too, so this guard is what makes the gate real.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # github.sha is not the commit CI tested, so pin everything to head_sha.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # npm ci + next build (with typecheck) on the 2-CPU VM takes
          # ~25-30 min; the 10m default and even 30m were too short.
          command_timeout: 60m
          script: |
            set -e
            cd /home/vinayak_shruti_biz

            # Non-interactive SSH does not source .bashrc, so the nvm
            # toolchain (node/npm/pm2) is not on PATH. Load it explicitly.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "Fetching latest code..."
            git fetch origin main
            git checkout --force ${{ github.event.workflow_run.head_sha }}
            echo "Checked out ${{ github.event.workflow_run.head_sha }}"

            echo "Installing dependencies..."
            npm ci --no-audit --no-fund

            echo "Building..."
            npm run build

            echo "Restarting app (pm2)..."
            pm2 restart nucrm-prod --update-env
            pm2 save

            echo "Waiting for app health check..."
            HEALTHY=""
            for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3099/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                HEALTHY="yes"
                echo "App healthy after ${i}x${{ env.HEALTH_CHECK_INTERVAL }}s"
                break
              fi
              echo "Attempt $i: health endpoint returned $STATUS"
              sleep ${{ env.HEALTH_CHECK_INTERVAL }}
            done

            # Gate on the health endpoint, not on process existence. pm2 can
            # report "online" while the app fails to serve.
            if [ -z "$HEALTHY" ]; then
              echo "ERROR: app did not become healthy. Rolling back to previous commit."
              git checkout --force ${{ github.event.workflow_run.head_sha }}^
              npm run build
              pm2 restart nucrm-prod --update-env
              pm2 save
              git checkout main
              exit 1
            fi

            # The deploy host is also the dev host; leave the repo on main
            # instead of a detached HEAD. The running app keeps serving the
            # built artifacts from the deployed commit.
            git checkout main

            echo "Deploy complete: ${{ github.event.workflow_run.head_sha }}"
