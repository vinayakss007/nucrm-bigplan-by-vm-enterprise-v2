name: Nightly load soak + RLS role guards (#2120, #2306)

# Five independent scheduled jobs.
#
#   soak       — k6 load soak. Disabled unless the repo variable LOAD_SOAK_ENABLED
#                is "true" and LOAD_SESSIONS_B64 (base64 of a sessions.json built
#                by tests/load/make-sessions.sh) plus LOAD_BASE_URL secrets exist.
#
#   test-catalog-ddl-screen — #2474. The static scan that keeps an integration
#                suite from putting `GRANT … ON SCHEMA public` back into a
#                `beforeAll`, which is how four suites ended up UPDATEing the same
#                pg_namespace tuple in the same second and CI died in a file the
#                branch never touched. Opt out with
#                TEST_CATALOG_DDL_GUARD_ENABLED="false".
#
#   register-drift-screen — #2416 follow-up. The content-vs-authoring screen over
#                docs/infra/PREPROD-ISSUE-REGISTER.md: every `path:N` citation is
#                compared against the cited file AT THE REVISION THAT WROTE IT.
#                Needs fetch-depth: 0, and needs a single fixed revision, which is
#                why it is scheduled against main instead of gating pull requests
#                (see the job below). Opt out with REGISTER_DRIFT_GUARD_ENABLED="false".
#
#   running-config-guard — #2332. The running-config drift guard scheduled with
#                its result recorded as an artifact (see the job below). Opt out
#                deliberately with RUNNING_CONFIG_GUARD_ENABLED="false".
#
#   rls-guards — #2306. The superuser/BYPASSRLS assertions in scripts/preflight.ts,
#                scripts/verify-tenant-isolation.ts and
#                scripts/check-db-role-privileges.mjs were code-complete but
#                scheduled by NOTHING (`grep preflight` across .github/workflows,
#                deploy/cron and scripts/cron-scheduler.ts returned no matches),
#                so "the live role happens to be non-superuser" stayed an
#                unenforced runtime fact — the exact reasoning behind retracting
#                #2253. One edited DATABASE_URL (a restore pointed at the dev
#                `postgres` superuser, say) silently turns every
#                tenant_isolation policy into a no-op for every paying customer,
#                and every test stays green because CI provisions its own DB.
#                This job runs the guards nightly, proves they actually fire
#                (negative control against a real superuser), records the results
#                as an artifact, and alerts on failure. Opt out deliberately with
#                the RLS_GUARD_ENABLED repo variable set to "false".
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  # ── #2306 — put the RLS role invariant on a schedule ────────────────────────
  rls-guards:
    name: RLS role guards
    if: vars.RLS_GUARD_ENABLED != 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Positive control: the guard passes a genuinely constrained role, so the
      # job is not red for a reason unrelated to the invariant.
      - name: Positive control — a least-privilege role passes the guard
        env:
          # A CI-only role in a CI-only database, and that database speaks
          # plaintext, so TLS is off here — see lib/db/ssl-config.ts.
          DATABASE_SSL: "false"
          DATABASE_URL: postgresql://nucrm_guard:ci-guard-only@localhost:5432/nucrm
        run: |
          set -euo pipefail
          RESULTS_DIR="$RUNNER_TEMP/rls-guard-results"
          mkdir -p "$RESULTS_DIR"
          psql "postgresql://postgres:postgres@localhost:5432/nucrm" -v ON_ERROR_STOP=1 -c \
            "DROP ROLE IF EXISTS nucrm_guard; CREATE ROLE nucrm_guard LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'ci-guard-only'" \
            | tee "$RESULTS_DIR/positive-control.log"
          npx tsx scripts/check-db-role-privileges.mjs 2>&1 \
            | tee -a "$RESULTS_DIR/positive-control.log"

      # Negative control: the acceptance criterion "a deliberate wrong-role
      # DATABASE_URL turns the run red" is asserted here, against a real
      # superuser, every single night — not assumed from the script's tests.
      - name: Negative control — the guard MUST fire against a superuser
        env:
          DATABASE_SSL: "false"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm
        run: |
          set -uo pipefail
          RESULTS_DIR="$RUNNER_TEMP/rls-guard-results"
          mkdir -p "$RESULTS_DIR"
          if npx tsx scripts/check-db-role-privileges.mjs 2>&1 | tee "$RESULTS_DIR/negative-control.log"; then
            echo "::error::#2306 the role guard PASSED a superuser connection — the invariant is not actually enforced."
            exit 1
          fi
          grep -q "SUPERUSER" "$RESULTS_DIR/negative-control.log" || {
            echo "::error::#2306 the guard failed, but not for the superuser reason — inspect negative-control.log."
            exit 1
          }
          echo "OK: a superuser DATABASE_URL turns this guard red, exactly as #2306 requires."

      # The real measurement: the pre-prod database, with the same three guards
      # the issue asked for. TLS stays at the shared default (on) here.
      - name: Live guards against the pre-prod database
        env:
          DATABASE_URL: ${{ secrets.PREPROD_DATABASE_URL }}
          NODE_ENV: production
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-not-weak-at-all-32chars-long-enough' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-session-secret-safe-value-32chars-long-enough' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-cron-secret-safe-value-that-is-32chars-long' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PREPROD_APP_URL || 'http://localhost:3000' }}
        run: |
          # `-e` is deliberately OFF here: this step collects each guard's exit
          # code so one gap cannot hide the others, then reports them together.
          set -uo pipefail
          RESULTS_DIR="$RUNNER_TEMP/rls-guard-results"
          mkdir -p "$RESULTS_DIR"
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::#2306 the nightly RLS guard has no live database to measure: add the PREPROD_DATABASE_URL repository secret (a least-privilege app role, see npm run db:provision-app-role), or set the RLS_GUARD_ENABLED variable to 'false' to opt out deliberately. A guard that silently never runs is the bug this job exists to prevent."
            exit 1
          fi

          # Full isolation survey: policies, FORCE RLS, unpoliced tables AND the
          # role invariant. Exits non-zero on any gap -> red nightly.
          npx tsx scripts/verify-tenant-isolation.ts 2>&1 | tee "$RESULTS_DIR/verify-tenant-isolation.log"
          iso=${PIPESTATUS[0]}
          npx tsx scripts/verify-tenant-isolation.ts --json > "$RESULTS_DIR/verify-tenant-isolation.json" || true

          # The same assertion the deploy gate and app startup make (#2306).
          npx tsx scripts/check-db-role-privileges.mjs 2>&1 | tee "$RESULTS_DIR/check-db-role-privileges.log"
          role=${PIPESTATUS[0]}

          # preflight.ts measures the whole boot profile (redis, email, off-site
          # backups), which is wider than this invariant, so its report is
          # recorded and only its db:rls verdict is promoted to a blocker here.
          # NODE_ENV=production makes that verdict a FAIL rather than a WARN.
          npx tsx scripts/preflight.ts 2>&1 | tee "$RESULTS_DIR/preflight.log" || true
          rls_fail=0
          if grep -q '\[FAIL\] db:rls' "$RESULTS_DIR/preflight.log"; then
            rls_fail=1
            echo "::error::#2306 preflight reports RLS is NOT enforced against the connecting role."
          fi

          echo "verify-tenant-isolation exit=$iso | check-db-role-privileges exit=$role | preflight db:rls fail=$rls_fail" \
            | tee "$RESULTS_DIR/summary.txt"
          if [ "$iso" -ne 0 ] || [ "$role" -ne 0 ] || [ "$rls_fail" -ne 0 ]; then
            exit 1
          fi

      - name: Upload guard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rls-guard-results-${{ github.run_number }}
          path: ${{ runner.temp }}/rls-guard-results
          if-no-files-found: warn
          retention-days: 30

      # Reuses the fan-out endpoint lib/critical-error-alert.ts posts to
      # (CRITICAL_ERROR_WEBHOOK_URL -> Slack/Discord/Telegram/PagerDuty). The
      # payload carries the run link only — never a connection string.
      - name: Alert operations on failure
        if: failure()
        env:
          CRITICAL_ALERT_URL: ${{ secrets.CRITICAL_ERROR_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${CRITICAL_ALERT_URL:-}" ]; then
            echo "No CRITICAL_ERROR_WEBHOOK_URL configured — the red nightly is the only alert."
            exit 0
          fi
          curl -sS -X POST "$CRITICAL_ALERT_URL" \
            -H 'Content-Type: application/json' \
            --max-time 10 \
            -d "{\"event\":\"rls_guard_nightly\",\"level\":\"fatal\",\"message\":\"#2306 nightly RLS role guard failed\",\"run_url\":\"$RUN_URL\",\"service\":\"nucrm-enterprise\"}" \
            || echo "alert delivery failed (non-blocking)"

  # ── #2332 — the running-config drift guard on a schedule ────────────────────
  # Same class of bug as #2306: a guard existed (scripts/check-running-config-
  # drift.mjs) but nothing scheduled it, so a bind mount pinned to a deleted
  # inode only gets noticed when a human remembers to run it. This job runs it
  # nightly and records the output as an artifact. A GitHub-hosted runner has
  # no compose-labelled containers, so the honest result there is the script's
  # NOT APPLICABLE line with the documented `--allow-empty` opt-out — printed,
  # never the old fake "0 · 0 · 0" green. The opt-out only downgrades exit 2;
  # drift, a missing declared service, or an untagged release (exit 1) still
  # turn this nightly red. On a host that serves the stack, drop the flag.
  running-config-guard:
    name: Running-config drift guard (#2332)
    if: vars.RUNNING_CONFIG_GUARD_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the drift guard
        run: |
          set -uo pipefail
          RESULTS_DIR="$RUNNER_TEMP/running-config-results"
          mkdir -p "$RESULTS_DIR"
          npm run guard:running-config -- --allow-empty 2>&1 | tee "$RESULTS_DIR/running-config.log"
          code=${PIPESTATUS[0]}
          echo "guard exit=$code" | tee -a "$RESULTS_DIR/running-config.log"
          exit "$code"

      - name: Upload guard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: running-config-results-${{ github.run_number }}
          path: ${{ runner.temp }}/running-config-results
          if-no-files-found: warn
          retention-days: 30

  # ── #2416 follow-up — the content-vs-authoring screen ──────────────────────
  # `guard:coords` asks whether a citation lands on a live line. Of the 25
  # coordinate pointers this register has actually lost, 24 landed on live lines
  # describing something else, and liveness printed "211/216 citations resolve,
  # exit 0" over every one of them. This screen reads each cited file at the
  # revision that WROTE the sentence and compares the content of the cited line,
  # so a pointer that slid onto a neighbouring statement is caught.
  #
  # It needs the whole history of every cited file — `fetch-depth: 0`, because
  # the default depth-1 checkout shrinks "then" to whatever the tip happens to
  # have, and the screen fails closed rather than reporting "0 moved" from a
  # tree that cannot see its own past.
  #
  # Nightly and not `pull_request`, measured rather than preferred: the answer
  # is branch-dependent. 10 pointers moved at c6efdac3 and 2 at afbf3131 (PR
  # #2441's tip) for the same cited files, so a PR gate would go red on
  # correctly-shaped stacked branches for a reason their author cannot fix. One
  # number, against main, once a night, means what it says.
  register-drift-screen:
    name: Register content-drift screen (#2416)
    if: vars.REGISTER_DRIFT_GUARD_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the screen
        run: |
          set -uo pipefail
          RESULTS_DIR="$RUNNER_TEMP/register-drift-results"
          mkdir -p "$RESULTS_DIR"
          npm run guard:register-drift 2>&1 | tee "$RESULTS_DIR/register-drift.log"
          code=${PIPESTATUS[0]}
          echo "screen exit=$code" | tee -a "$RESULTS_DIR/register-drift.log"
          exit "$code"

      - name: Upload screen results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: register-drift-results-${{ github.run_number }}
          path: ${{ runner.temp }}/register-drift-results
          if-no-files-found: warn
          retention-days: 30

  # ── #2474 — the shared-catalog DDL screen ──────────────────────────────────
  # `GRANT … ON SCHEMA public` is an UPDATE of the one pg_namespace row named
  # `public`. Four integration suites each issued one in `beforeAll`, vitest runs
  # one worker per file, and the four `beforeAll`s land in the same second — so
  # the tuple is written concurrently and Postgres raises `XX000 tuple
  # concurrently updated` rather than retrying. The casualty on CI was
  # `tests/integration/superadmin-panel-sql.test.ts`, in a run of a PR that never
  # edited it. The repair is role membership instead of object ACLs
  # (tests/helpers/rls-probe-role-2474.ts); this is the screen that keeps a fifth
  # suite from rejoining a race four suites were winning, which is why it exists
  # at all: the failure is a lottery, so "it passed locally" proves nothing.
  #
  # Nightly, per the issue, not the fast job. The screen is a static scan of the
  # checked-out tree — no database, no `npm ci`, milliseconds — and the unit test
  # `tests/unit/test-catalog-ddl-screen-2474.test.ts` runs the same `scanTree()`
  # on every `npm test`, so a reintroduction is caught by the PR job through the
  # test suite even before this job fires.
  test-catalog-ddl-screen:
    name: Shared-catalog DDL screen (#2474)
    if: vars.TEST_CATALOG_DDL_GUARD_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the screen
        run: |
          set -uo pipefail
          RESULTS_DIR="$RUNNER_TEMP/test-catalog-ddl-results"
          mkdir -p "$RESULTS_DIR"
          npm run guard:test-catalog-ddl 2>&1 | tee "$RESULTS_DIR/test-catalog-ddl.log"
          code=${PIPESTATUS[0]}
          echo "screen exit=$code" | tee -a "$RESULTS_DIR/test-catalog-ddl.log"
          exit "$code"

      - name: Upload screen results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-catalog-ddl-results-${{ github.run_number }}
          path: ${{ runner.temp }}/test-catalog-ddl-results
          if-no-files-found: warn
          retention-days: 30

  soak:
    name: Load soak
    if: vars.LOAD_SOAK_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-key.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Write sessions file
        run: |
          umask 077
          printf '%s' "${{ secrets.LOAD_SESSIONS_B64 }}" | base64 -d > /tmp/sessions.json

      - name: Baseline smoke (QUICK)
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          SESSIONS_FILE: /tmp/sessions.json
          QUICK: "1"
          VUS: "10"
          QUICK_DURATION: "60s"
        run: |
          k6 run tests/load/baseline.js \
            --env BASE_URL --env SESSIONS_FILE --env QUICK --env VUS --env QUICK_DURATION \
            --summary-export=/tmp/baseline.json

      - name: Write-heavy smoke (QUICK)
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          SESSIONS_FILE: /tmp/sessions.json
          QUICK: "1"
          VUS: "5"
          QUICK_DURATION: "60s"
        run: |
          k6 run tests/load/write-heavy.js \
            --env BASE_URL --env SESSIONS_FILE --env QUICK --env VUS --env QUICK_DURATION \
            --summary-export=/tmp/write-heavy.json

      - name: Upload summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-soak-${{ github.run_number }}
          path: /tmp/*.json
          if-no-files-found: ignore
