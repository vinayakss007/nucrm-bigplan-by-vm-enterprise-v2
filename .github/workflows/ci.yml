name: CI

on:
  pull_request:
  push:
    branches: [main, feat/enterprise-infrastructure]

env:
  NODE_ENV: test
  NODE_OPTIONS: --max-old-space-size=8192
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-not-weak-at-all-32chars-long-enough' }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-session-secret-safe-value-32chars-long-enough' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-cron-secret-safe-value-that-is-32chars-long' }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2' }}
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  METRICS_SECRET: ${{ secrets.METRICS_SECRET || 'ci-metrics-secret-value-safe-32chars-long-enough' }}
  SETUP_KEY: ${{ secrets.SETUP_KEY || 'ci-setup-key-safe-value-that-is-32characters-long' }}
  ALLOWED_ORIGINS: http://localhost:3000
  DATABASE_SSL: "false"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: RLS route-coverage guard (#1838)
        run: npm run guard:rls

      - name: CSRF coverage guard (#C2)
        run: npm run guard:csrf

      - name: Schema drift guard (#1883)
        run: npm run guard:schemas

      - name: Route-boundary coverage guard (#1840)
        run: npm run guard:boundaries

      - name: File-size ratchet (#1843)
        run: npm run guard:filesize

      - name: no-explicit-any suppression ratchet (#1268)
        run: npm run guard:any-suppressions

      - name: Migration chain guard (#46)
        run: npm run guard:chain

      - name: Migration row-DML / RLS guard (PP-058)
        run: npm run guard:migration-rls

      - name: Counter increment ratchet (#2344)
        run: npm run guard:counters

      - name: CSV formula-escape guard (#2340)
        run: npm run guard:csv

      - name: Public-route soft-delete guard (#2382)
        run: npm run guard:portal-softdelete
      - name: Public-route rate-limit guard (#2417)
        run: npm run guard:public-ratelimit
      - name: Public row-projection guard (#2440 writes, #2443 reads)
        run: npm run guard:public-projection
      - name: Portal RLS-context + guard scripts that must stay wired (#2446, #2825, #2829)
        run: npm run guard:portal-rls-context && npm run guard:catch-empty && npm run guard:panel-error-state
      - name: Register coordinate guard (#2416)
        run: npm run guard:coords
      - name: Cron lock + field-permission wiring guards (#2539, #2597)
        run: npm run guard:cron-lock && npm run guard:field-permissions
      - name: Raw-SQL identifier + statement_timeout guard (#2528)
        run: npm run guard:raw-sql

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Sync database schema
        run: npm run db:sync

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage report
        run: npm run test:coverage

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Sync database schema
        run: npm run db:sync
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test

      - name: Apply RLS migrations
        run: node scripts/apply-rls-ci.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test
          DATABASE_SSL: "false"
          REDIS_URL: redis://localhost:6379

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: addnab/docker-run-action@v3
        with:
          image: zricethezav/gitleaks:latest
          options: -v ${{ github.workspace }}:/repo
          run: gitleaks detect --source=/repo --verbose --redact

  security-scan:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # #2301: previously `npm audit` ran with continue-on-error: true, so HIGH
      # CVEs shipped on a green build. The audit is now BLOCKING, with the same
      # baseline-ratchet pattern as guard:rls / guard:chain: pre-existing
      # advisories are grandfathered in scripts/audit-baseline.json (each with a
      # written reason); any NEW HIGH/CRITICAL advisory fails the job.
      - name: npm audit baseline guard (#2301)
        run: npm audit --audit-level=high --json | node scripts/check-audit-baseline.mjs

      - name: Run gitleaks (path scan)
        uses: addnab/docker-run-action@v3
        with:
          image: zricethezav/gitleaks:latest
          options: -v ${{ github.workspace }}:/repo
          run: gitleaks detect --source=/repo --no-git --verbose

      # #2301: the analysis step is BLOCKING (no continue-on-error). It runs the
      # pinned Semgrep CLI in Docker (same image family as semgrep/semgrep-action,
      # but with a controlled, version-pinned invocation — the action skipped the
      # scan entirely without SEMGREP_APP_TOKEN, which is exactly how findings
      # went invisible). New ruleId::file findings fail the job unless explicitly
      # baselined with a reason in scripts/semgrep-baseline.json.
      - name: Run Semgrep SAST (#2301 — blocking)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            returntocorp/semgrep:1.178.0 \
            semgrep scan \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/nextjs \
              --config p/security-audit \
              --sarif --output /src/semgrep.sarif \
              --metrics=off \
              --max-target-bytes=2000000 \
              /src

      - name: Semgrep baseline guard (#2301)
        run: node scripts/check-semgrep-baseline.mjs semgrep.sarif

      # Only attempt the SARIF upload when Semgrep actually produced the file.
      # The upload stays best-effort (GitHub code-scanning ingestion of
      # third-party SARIF is non-essential to the gate — the ANALYSIS steps
      # above are what fail the job). Previously the upload ran with
      # `if: always()` and errored when semgrep.sarif was absent. (#1419, #2301)
      - name: Check for SARIF output
        id: sarif
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No semgrep.sarif produced — skipping SARIF upload."
          fi

      - name: Upload SAST results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.sarif.outputs.exists == 'true'
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  build:
    name: Build
    needs: [lint-typecheck, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # Keyed on the inputs that can invalidate the build cache — the
          # dependency tree, the bundled font files and the build config — not
          # on the whole tree, so a source-only change still gets a hit. Fonts
          # are vendored as of #2426, so a cold entry costs time only: it can no
          # longer fail the build on a third-party fetch.
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json', 'app/fonts/**', 'next.config.mjs') }}
          restore-keys: ${{ runner.os }}-next-cache-

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Check bundle size thresholds
        run: npx tsx scripts/analyze-bundle.ts

  lockfile-guard:
    name: Single Lockfile Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This project installs with `npm ci`, so package-lock.json is the single
      # source of truth. A committed pnpm-lock.yaml or yarn.lock would let a
      # contributor (or CI runner) resolve a DIFFERENT dependency tree than
      # production — a supply-chain/non-determinism hazard. Fail the build if
      # either reappears.
      - name: Reject foreign lockfiles
        run: |
          set -e
          foreign=$(git ls-files 'pnpm-lock.yaml' 'yarn.lock' '**/pnpm-lock.yaml' '**/yarn.lock')
          if [ -n "$foreign" ]; then
            echo "::error::Found non-npm lockfile(s). This repo installs with 'npm ci'; keep only package-lock.json:"
            echo "$foreign"
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing — it is the required lockfile."
            exit 1
          fi
          echo "OK: package-lock.json is the only committed lockfile."

  # #2450 — the install sequences, run end to end against a real PostgreSQL.
  # CI's own provisioning (`db:sync` + `apply-rls-ci.mjs`) never executes the
  # migration chain, so the chain was only ever believed: following the
  # documented sequence (`db:sync` then `db:migrate`) produced 227 tables, ZERO
  # RLS policies, an empty ledger and 21 missing SQL functions. This job runs
  # both shapes and asserts each outcome is coherent — the pushed schema is
  # refused before anything is stamped, an empty `db:bootstrap` build measures
  # up (policies, RLS-enabled tables, ledger = journal, no promised object
  # missing). Appended after every existing job on purpose: the register cites
  # ci.yml:63, :86, :120, :165 and :215, and inserting anywhere above them
  # moves those coordinates out from under `guard:coords`.
  fresh-install:
    name: Fresh Install Sequence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Push refuses coherently; bootstrap builds a protected, stamped schema
        run: npx tsx scripts/check-fresh-install-sequence.mts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test
          DATABASE_SSL: "false"

      # #2508 — the same chain-built schema, measured COLUMN by COLUMN.
      # Step B above proves the journal reaches a protected, stamped database;
      # it counts tables, policies, functions and ledger rows, so a database 26
      # migrations behind still passes: `portal_token NOT NULL` next to a schema
      # that declares it nullable is not a missing table, a missing policy or a
      # missing function, and every screen here was blind to it (#2499). This
      # step builds the shape step B just proved (empty database + db:bootstrap,
      # never the CI provisioning's `db:sync`, which would push the schema and
      # make the comparison tautological) and runs `db:drift-check` against it,
      # so "the migration chain does not produce the schema the code declares"
      # fails a pull request. `scripts/schema-drift-allowlist.json` masks drift
      # a pending migration is already clearing; anything new goes red, and the
      # nightly half of this guard (#2508 AC3) measures the database we serve:
      # `.github/workflows/schema-drift.yml`.
      #
      # Appended at the end of the last job in the file, which is the only place
      # in `ci.yml` a step can be added without moving a register coordinate
      # (`ci.yml:63`, `:86`, `:120`, `:165`, `:215`, `:217`, `:250`).
      - name: Schema drift check (column-level) against a chain-built database
        run: |
          set -euo pipefail
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/nucrm_chain
          export DATABASE_SSL=false
          psql "postgresql://postgres:postgres@localhost:5432/nucrm_test" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nucrm_chain'
          npm run db:bootstrap -- --yes
          npm run db:drift-check

      # #3167 — no top-level `overrides` entry may force a package outside the
      # range its parent declares. Appended here rather than next to the other
      # `guard:*` steps because the register cites `ci.yml` up to `:409`, and
      # inserting above those coordinates moves them out from under
      # `guard:coords` (see the note at :349). This job already runs `npm ci`,
      # which the guard needs for `semver`.
      - name: Override range guard (#3167)
        run: npm run guard:override-ranges

  # #2596 — every process.env name the app reads must be in `.env.example`, or
  # carry a written reason in `scripts/env-coverage-allowlist.json`. The failure
  # this removes is silent: a deployment that never sets a variable takes its
  # default path and nothing anywhere says the knob exists. `METRICS_SECRET`
  # (#2221) and `BACKUP_ENCRYPTION_KEY` are the shape of it — features that
  # degrade to "off" with a 200 and a log line.
  #
  # Appended as a NEW JOB at the end of the file rather than as steps inside an
  # existing one, because the register cites coordinates in this file
  # (`ci.yml:63`, `:86-87`, `:92-105`, `:126`, `:135-185`, `:171`, `:221`,
  # `:401`) and anything inserted below the last `run:` of the last job would
  # move every line after it. Nothing above the end of the file has shifted on
  # this branch, which is what `npm run guard:coords` checks.
  #
  # No `npm ci`: scripts/check-env-coverage.mjs imports node built-ins only, so
  # the screen costs seconds rather than a dependency install.
  env-coverage:
    name: Env coverage (#2596)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Every environment variable is documented or allowlisted
        run: node scripts/check-env-coverage.mjs

  # PP-059's chain half. `npm run guard:vocab` is the only command in this repo that asks a real
  # database what its CHECK constraints will actually accept (`pg_get_constraintdef`, not the `.sql`
  # text), and it has never run in CI: adding this job,
  # `grep -rn -E 'run:.*(guard:vocab|check-constraint-vocab)' .github/workflows` returned 0, and the
  # single prose hit was `schema-drift.yml:7` naming this very guard as "code-complete and scheduled
  # by nothing" while explaining why that file exists. Meanwhile #2508 gave the pipeline exactly the
  # host it needs — `fresh-install` builds a schema from the migration chain with `db:bootstrap` at
  # `:401-409`, on every pull request — and walked past it.
  #
  # What this buys, that `tests/unit/constraint-vocab-registry.test.ts` cannot: that suite pins the
  # registry from source (every required value names a writer, every cited file still contains the
  # literal, every widening migration exists and is journaled — its own header limits it to "what IS
  # checkable from source alone"). It cannot see a journaled migration whose `IN (…)` list omits the
  # value it was written to allow, or one that narrows a list it should only have widened. Both are
  # measured here, against the database the chain produces.
  #
  # Two controls, because `schema-drift.yml:17-24` set the posture this repo adopted: "Without this the
  # job would be an assertion that a green screen means something, which is precisely the reasoning
  # #2306 retracted for the role guards." The negative half is verified to fire locally before this
  # file was pushed (one bogus `required` value in a scratch copy of the registry -> exit 1,
  # `kind: missing-in-db`, naming `lib/api/schemas/billing.ts`), and the positive half is green
  # statically for all 10 registry entries: the last chain file defining each constraint
  # (`0101`, `0102`, `0103`, `0104`, `0120`, `0050`, `0050`, `0106`, `0112`, `0050`) already covers
  # every `required` value.
  #
  # This is NOT PP-059's live half. Pre-prod still lacks `0112`/`0120` — two of the 24 entries PP-057
  # counts that PP-060 says nothing applies — so `guard:vocab` stays red there, and correctly so. This
  # job measures the chain, not the deployment.
  #
  # Appended as a NEW JOB at the end of the file: ci.yml is 447 lines and `:447` is itself a cited
  # coordinate for `guard:coords`, as are `:401`, `:254` and `:221`, so anything inserted above them
  # moves them out from under the register (same reasoning as the note at `:427-432`).
  constraint-vocab:
    name: Constraint vocabulary vs migration chain (PP-059)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow-level DATABASE_URL (:11) points at `nucrm_test`, which this job never provisions —
    # an empty database would make the guard exit 2, which is "could not run", not "clean".
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_chain
      DATABASE_SSL: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm_chain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The chain, never `db:sync`: the guard's own argument is that a migration which exists on disk
      # but was never applied is how #43 happened, so the database it measures has to be one the
      # journal produced. `POSTGRES_DB` above names the same database `env.DATABASE_URL` points at,
      # so nothing here has to CREATE it and no step can fall back to the file-level `nucrm_test`.
      - name: Build the schema from the migration chain
        run: |
          set -euo pipefail
          npm run db:bootstrap -- --yes

      # `|| code=$?`-style capture because GitHub's default `run:` shell is `bash -e`, and because a
      # bare `npm run guard:vocab | tee` would replace the guard's exit code with tee's. The human
      # table is deliberately not `--json`: on failure it prints `[missing-in-db] invoices.status`
      # plus the writers, which is what the reader of a red job needs.
      - name: Positive control - the chain-built database accepts every value the registry says code writes
        run: |
          set -uo pipefail
          npm run guard:vocab 2>&1 | tee "$RUNNER_TEMP/guard-vocab-positive.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::error::PP-059 the migration chain produces a database whose CHECK constraints reject a value the code writes (23514) — findings above. Widen the constraint in a new migration and list the value in scripts/constraint-vocab.json, or stop writing it. Do not delete the registry entry to silence this job."
          fi
          exit "$code"

      - name: Negative control - a CHECK that rejects 'void' MUST turn this guard red
        run: |
          set -uo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "invoices" DROP CONSTRAINT IF EXISTS "chk_invoices_status";
          ALTER TABLE "invoices" ADD CONSTRAINT "chk_invoices_status"
            CHECK ("status" IN ('draft','sent','paid','overdue','cancelled','partially_paid','written_off','pending'));
          SQL
          # GitHub's default shell for a `run:` step is `bash -e`, and `set -uo pipefail` does not
          # clear it, so the expected failure has to be captured with `|| code=$?` — written bare,
          # the shell aborts on the guard's exit 1 before a single assertion runs and the step reports
          # a red control with no annotation. Verified locally under `bash -e`.
          code=0
          npm run guard:vocab -- --json > "$RUNNER_TEMP/guard-vocab-negative.log" 2>&1 || code=$?
          if [ "$code" != "1" ]; then
            echo "::error::PP-059 the constraint-vocabulary guard exited $code against a database that rejects 'void', which lib/api/schemas/billing.ts writes. Expected 1: the step is not measuring the database."
            cat "$RUNNER_TEMP/guard-vocab-negative.log"
            exit 1
          fi
          if ! grep -qE '"kind": *"missing-in-db"' "$RUNNER_TEMP/guard-vocab-negative.log" || ! grep -qE '"id": *"invoices.status"' "$RUNNER_TEMP/guard-vocab-negative.log"; then
            echo "::error::PP-059 the guard exited 1 but did not report invoices.status as missing-in-db. It went red for some other reason, which is not a control."
            cat "$RUNNER_TEMP/guard-vocab-negative.log"
            exit 1
          fi
          if ! grep -q "'void'" "$RUNNER_TEMP/guard-vocab-negative.log"; then
            echo "::error::PP-059 the guard failed on invoices.status without naming 'void' — a different constraint is being compared than the one this control breaks."
            cat "$RUNNER_TEMP/guard-vocab-negative.log"
            exit 1
          fi
          echo "OK: a value the code writes that this database rejects turns the guard red, naming the constraint and its writer."
