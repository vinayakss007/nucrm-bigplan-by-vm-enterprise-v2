name: CI

on:
  pull_request:
  push:
    branches: [main, feat/enterprise-infrastructure]

env:
  NODE_ENV: test
  NODE_OPTIONS: --max-old-space-size=8192
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-not-weak-at-all-32chars-long-enough' }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-session-secret-safe-value-32chars-long-enough' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-cron-secret-safe-value-that-is-32chars-long' }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2' }}
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  METRICS_SECRET: ${{ secrets.METRICS_SECRET || 'ci-metrics-secret-value-safe-32chars-long-enough' }}
  SETUP_KEY: ${{ secrets.SETUP_KEY || 'ci-setup-key-safe-value-that-is-32characters-long' }}
  ALLOWED_ORIGINS: http://localhost:3000
  DATABASE_SSL: "false"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: RLS route-coverage guard (#1838)
        run: npm run guard:rls

      - name: CSRF coverage guard (#C2)
        run: npm run guard:csrf

      - name: Schema drift guard (#1883)
        run: npm run guard:schemas

      - name: Route-boundary coverage guard (#1840)
        run: npm run guard:boundaries

      - name: File-size ratchet (#1843)
        run: npm run guard:filesize

      - name: no-explicit-any suppression ratchet (#1268)
        run: npm run guard:any-suppressions

      - name: Migration chain guard (#46)
        run: npm run guard:chain

      - name: Migration row-DML / RLS guard (PP-058)
        run: npm run guard:migration-rls

      - name: Counter increment ratchet (#2344)
        run: npm run guard:counters

      - name: CSV formula-escape guard (#2340)
        run: npm run guard:csv

      - name: Public-route soft-delete guard (#2382)
        run: npm run guard:portal-softdelete
      - name: Public-route rate-limit guard (#2417)
        run: npm run guard:public-ratelimit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Sync database schema
        run: npm run db:sync

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage report
        run: npm run test:coverage

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nucrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Sync database schema
        run: npm run db:sync
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test

      - name: Apply RLS migrations
        run: node scripts/apply-rls-ci.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nucrm_test
          DATABASE_SSL: "false"
          REDIS_URL: redis://localhost:6379

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: addnab/docker-run-action@v3
        with:
          image: zricethezav/gitleaks:latest
          options: -v ${{ github.workspace }}:/repo
          run: gitleaks detect --source=/repo --verbose --redact

  security-scan:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # #2301: previously `npm audit` ran with continue-on-error: true, so HIGH
      # CVEs shipped on a green build. The audit is now BLOCKING, with the same
      # baseline-ratchet pattern as guard:rls / guard:chain: pre-existing
      # advisories are grandfathered in scripts/audit-baseline.json (each with a
      # written reason); any NEW HIGH/CRITICAL advisory fails the job.
      - name: npm audit baseline guard (#2301)
        run: npm audit --audit-level=high --json | node scripts/check-audit-baseline.mjs

      - name: Run gitleaks (path scan)
        uses: addnab/docker-run-action@v3
        with:
          image: zricethezav/gitleaks:latest
          options: -v ${{ github.workspace }}:/repo
          run: gitleaks detect --source=/repo --no-git --verbose

      # #2301: the analysis step is BLOCKING (no continue-on-error). It runs the
      # pinned Semgrep CLI in Docker (same image family as semgrep/semgrep-action,
      # but with a controlled, version-pinned invocation — the action skipped the
      # scan entirely without SEMGREP_APP_TOKEN, which is exactly how findings
      # went invisible). New ruleId::file findings fail the job unless explicitly
      # baselined with a reason in scripts/semgrep-baseline.json.
      - name: Run Semgrep SAST (#2301 — blocking)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            returntocorp/semgrep:1.178.0 \
            semgrep scan \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/nextjs \
              --config p/security-audit \
              --sarif --output /src/semgrep.sarif \
              --metrics=off \
              --max-target-bytes=2000000 \
              /src

      - name: Semgrep baseline guard (#2301)
        run: node scripts/check-semgrep-baseline.mjs semgrep.sarif

      # Only attempt the SARIF upload when Semgrep actually produced the file.
      # The upload stays best-effort (GitHub code-scanning ingestion of
      # third-party SARIF is non-essential to the gate — the ANALYSIS steps
      # above are what fail the job). Previously the upload ran with
      # `if: always()` and errored when semgrep.sarif was absent. (#1419, #2301)
      - name: Check for SARIF output
        id: sarif
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No semgrep.sarif produced — skipping SARIF upload."
          fi

      - name: Upload SAST results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.sarif.outputs.exists == 'true'
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  build:
    name: Build
    needs: [lint-typecheck, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Keyed on the inputs that can invalidate the build cache — the
          # dependency tree, the bundled font files and the build config — not
          # on the whole tree, so a source-only change still gets a hit. Fonts
          # are vendored as of #2426, so a cold entry costs time only: it can no
          # longer fail the build on a third-party fetch.
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json', 'app/fonts/**', 'next.config.mjs') }}
          restore-keys: ${{ runner.os }}-next-cache-

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Check bundle size thresholds
        run: npx tsx scripts/analyze-bundle.ts

  lockfile-guard:
    name: Single Lockfile Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This project installs with `npm ci`, so package-lock.json is the single
      # source of truth. A committed pnpm-lock.yaml or yarn.lock would let a
      # contributor (or CI runner) resolve a DIFFERENT dependency tree than
      # production — a supply-chain/non-determinism hazard. Fail the build if
      # either reappears.
      - name: Reject foreign lockfiles
        run: |
          set -e
          foreign=$(git ls-files 'pnpm-lock.yaml' 'yarn.lock' '**/pnpm-lock.yaml' '**/yarn.lock')
          if [ -n "$foreign" ]; then
            echo "::error::Found non-npm lockfile(s). This repo installs with 'npm ci'; keep only package-lock.json:"
            echo "$foreign"
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing — it is the required lockfile."
            exit 1
          fi
          echo "OK: package-lock.json is the only committed lockfile."
