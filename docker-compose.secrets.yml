# ============================================================================
# Secret-files overlay (#2123) — docker inspect hardening for the Docker app
# path (web/worker/realtime). Production runs the app under pm2; this overlay
# is for hosts that use compose for the full stack.
#
# Usage:
#   1. Create ./secrets/ on the host with one FILE PER SECRET, mode 600:
#        jwt_secret  session_secret  setup_key  cron_secret  encryption_key
#        database_url  redis_url  redis_password  s3_secret_key
#        postgres_password  grafana_admin_password
#      (file name = env var in lowercase; see lib/secrets-file.ts)
#   2. docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# The app entrypoints (instrumentation.ts, worker.ts, realtime.ts) read the
# mounted files into process.env at startup, but ONLY for variables that are
# not already set — .env.local development is unaffected by this file.
# postgres/grafana/redis use their images' native file-based mechanisms.
# ============================================================================

services:
  web:
    environment:
      DATABASE_URL: null
      REDIS_URL: null
      JWT_SECRET: null
      SESSION_SECRET: null
      SETUP_KEY: null
      CRON_SECRET: null
      ENCRYPTION_KEY: null
      S3_SECRET_KEY: null
    volumes:
      - ./secrets:/run/secrets:ro

  worker:
    environment:
      DATABASE_URL: null
      REDIS_URL: null
      JWT_SECRET: null
      SESSION_SECRET: null
      SETUP_KEY: null
      CRON_SECRET: null
      ENCRYPTION_KEY: null
    volumes:
      - ./secrets:/run/secrets:ro

  realtime:
    environment:
      DATABASE_URL: null
      REDIS_URL: null
      JWT_SECRET: null
      SESSION_SECRET: null
      ENCRYPTION_KEY: null
    volumes:
      - ./secrets:/run/secrets:ro

  postgres:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./secrets:/run/secrets:ro

  redis:
    # Read the password from the mounted file at runtime so it never appears
    # in the container's command metadata either.
    command: >
      sh -c 'exec redis-server
      --requirepass "$(cat /run/secrets/redis_password)"
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1000
      --appendonly yes'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$(cat /run/secrets/redis_password)" ping | grep -q PONG',
        ]
    volumes:
      - ./secrets:/run/secrets:ro

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: null
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
    volumes:
      - ./secrets:/run/secrets:ro
