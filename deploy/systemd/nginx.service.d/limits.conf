# #3276 — the host nginx path (packaged nginx in front of the pm2 app on the
# production VM). `worker_rlimit_nofile 65535` in ../nginx/nginx-production.conf
# is only a request: nginx raises a soft limit as far as the unit grants, and the
# distribution unit grants 1024, so every worker logged
#   setrlimit(RLIMIT_NOFILE, 65535) failed (13: Permission denied)
# at start and served the site on 1024 fds while the config claimed 65535.
#
# Not yet installed — see README.md. Install and verify:
#   sudo cp -r nginx.service.d /etc/systemd/system/
#   sudo systemctl daemon-reload && sudo systemctl restart nginx
#   systemctl show nginx -p LimitNOFILE            # 65535
#   tail /var/log/nginx/error.log | grep setrlimit # silent after the restart
#
# The number is one fact with three surfaces (conf, this drop-in, the compose
# service's `ulimits:`). tests/unit/nginx-fd-limit-agreement-3276.test.ts is what
# stops them drifting, the same way #3410's crontab lesson did.
[Service]
LimitNOFILE=65535
