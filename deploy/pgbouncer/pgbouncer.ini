[databases]
* = host=host.docker.internal port=5432 dbname=nucrm

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = session
default_pool_size = 50
max_client_conn = 200
max_db_connections = 50

; CRITICAL for RLS tenant isolation: clear all session-level GUCs (including
; app.current_tenant and app.current_user) when a connection returns to the pool.
; Without this, a tenant's GUC from is_local=false would leak to the next checkout.
server_reset_query = DISCARD ALL
idle_transaction_timeout = 300
query_timeout = 30
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 10

stats_period = 60
application_name_add_host = true

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3

; ─────────────────────────────────────────────────────────────────────────────
; NOTE (#3404): nothing loads this file. No compose service mounts it — the
; edoburu/pgbouncer containers generate their config from the POOL_MODE /
; SERVER_RESET_QUERY / *_POOL_SIZE env vars in
; deploy/docker-compose.{preprod,production}.yml and docker-compose.yml. It is
; kept as the reference config for a hand-run pooler, which is why guard:pool-mode
; (scripts/check-pool-mode-invariant.mjs, R4) requires its pool_mode to agree with
; the ones that ship: this line read `pool_mode = transaction` while preprod ran
; session, and a dead file stating the unsafe mode is how that went unseen.
; The [pgbouncer] listen_addr above is 0.0.0.0 — if this file is ever mounted,
; 127.0.0.1 first (#1042 removed exactly that exposure from the live path).
; ─────────────────────────────────────────────────────────────────────────────
