---
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Container stdout/stderr (#2053) ────────────────────────────────────────
  #
  # This is the only job that can reach the application's logs. The app, worker,
  # realtime, nginx and redis containers write to stdout and nothing else: the
  # file jobs that used to sit here pointed at `/var/log/app` (does not exist on
  # this host) and `/var/log/redis` (redis logs to stdout inside its container),
  # so promtail discovered zero targets and Loki silently held no application
  # logs while the pipeline looked configured.
  #
  # Requires the Docker socket mounted read-only (see the compose services).
  #
  # Deliberately NO `docker: {}` pipeline stage. That stage parses Docker's
  # json-file format (`{"log":…}`), which only appears when the log files are
  # tailed directly; over the daemon API docker_sd reads, lines arrive plain.
  # Applied to a plain line the stage fails to unmarshal and drops the entry,
  # which would reproduce the exact silent-empty-store failure this job exists
  # to fix.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # docker_sd_configs takes no `labels:` block in Promtail 3.0 (the parser
      # rejects it outright), so the job name is applied as a constant relabel.
      - target_label: "job"
        replacement: "nucrm-container"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      # Loki stores what promtail pushes. Tailing either of them makes the
      # pipeline read its own output, which grows without bound.
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "(promtail|loki)"
        action: "drop"

  # ── #2602: the `postgres-logs` job is deleted, not kept inert ───────────────
  # It tailed /var/log/postgresql/*.log with a comment claiming the directory
  # "exists on this host". It does not: the production database is
  # UpCloud-managed (see deploy/docker-compose.preprod.yml, pgbouncer block),
  # and the path exists neither on the VM nor inside the promtail container —
  # so the job matched zero targets and a {job="nucrm-postgres"} query returned
  # zero streams forever, silently. An inert job with no error is worse than a
  # failing one: anyone using Loki as evidence for "are there Postgres log
  # problems?" reads silence as a no. Postgres is monitored through
  # postgres-exporter metrics (deploy/monitoring/prometheus.yml), not through logs.
