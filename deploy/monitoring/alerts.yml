groups:
  - name: nucrm-app
    rules:
      - alert: AppDown
        expr: up{job="nucrm-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NuCRM app is DOWN"
          description: "The NuCRM application has been unreachable for over 1 minute."

      - alert: AppHighLatency
        expr: nucrm_db_latency_ms > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB latency > 200ms"
          description: "Database query latency has exceeded 200ms for 5 minutes."

      - alert: AppHeapHigh
        expr: nucrm_memory_heap_used_bytes / nucrm_memory_heap_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "App heap usage > 90%"
          description: "Node.js heap usage has exceeded 90% for 5 minutes."

      - alert: AppHighErrorRate
        expr: rate(nucrm_http_requests_total{status=~"5.."}[5m]) / rate(nucrm_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate > 5%"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: NoTasksPending
        expr: nucrm_tasks_pending_total == 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "All tasks completed"
          description: "All pending tasks are now completed."

  - name: nucrm-infra
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL exporter has been unreachable for over 1 minute."

      - alert: PostgresHighConnections
        expr: nucrm_db_active_connections / nucrm_db_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80%"
          description: "Active DB connections have exceeded 80% of the maximum for 5 minutes."

      - alert: PostgresHighWaitingQueries
        expr: nucrm_db_waiting_queries > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL waiting queries > 5"
          description: "More than 5 queries are waiting for a connection pool slot."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis exporter has been unreachable for over 1 minute."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 90%"
          description: "Redis memory usage has exceeded 90% of max memory."

      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 90%"
          description: "Server CPU usage has exceeded 90% for 10 minutes."

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory > 90%"
          description: "Server memory usage has exceeded 90% for 5 minutes."

      - alert: HostDiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk > 90% full"
          description: "Root filesystem usage has exceeded 90%."
