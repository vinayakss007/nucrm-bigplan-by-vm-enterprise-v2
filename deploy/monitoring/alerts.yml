groups:
  - name: nucrm-app
    rules:
      - alert: AppDown
        expr: up{job="nucrm-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NuCRM app is DOWN"
          description: "The NuCRM application has been unreachable for over 1 minute."

      - alert: AppHighLatency
        expr: nucrm_db_latency_ms > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB latency > 200ms"
          description: "Database query latency has exceeded 200ms for 5 minutes."

      - alert: AppHeapHigh
        expr: nucrm_memory_heap_used_bytes / nucrm_memory_heap_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "App heap usage > 90%"
          description: "Node.js heap usage has exceeded 90% for 5 minutes."

      - alert: AppHighErrorRate
        # The app collector exports http_requests_total WITHOUT a nucrm_
        # prefix (lib/metrics.ts trackRequest) — the old expr matched a
        # series that never exists, so this alert could not fire.
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate > 5%"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: AppCacheDown
        # nucrm_cache_up is emitted by /api/metrics every scrape (1 healthy,
        # 0 unreachable), so the 0 reflects the CURRENT scrape, not a stale
        # last-bad sample.
        expr: nucrm_cache_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "App cannot reach Redis"
          description: "/api/metrics reports nucrm_cache_up == 0 — queue and cache telemetry is dark."

      - alert: AppDbSectionDown
        expr: nucrm_db_up == 0 or nucrm_db_pool_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Metrics DB section failing"
          description: "/api/metrics DB gauge or pool section returned down (#2118) — check the app DB pool."

      - alert: AppRateLimitSurge
        # #2117 ask 3: sustained 429s mean legitimate clients are being
        # throttled (per-user/per-route budgets), which reads to users as
        # the app being broken. Covers in-app limiter rejects; nginx/edge
        # rejects never reach the app's collector (noted in #2117).
        expr: sum by (path) (rate(http_requests_total{status="429"}[2m])) * 60 > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "429 surge on {{ $labels.path }} (>30/min sustained)"
          description: "Route {{ $labels.path }} is rate-limiting steadily for 1+ minute — check limiter budgets before users self-DoS."

      - alert: QueueBacklogHigh
        # nucrm_queue_jobs_total covers all ten worker queues (6f9f6999).
        expr: max by (queue) (nucrm_queue_jobs_total{status="waiting"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BullMQ queue backlog > 100"
          description: "Queue {{ $labels.queue }} has >100 waiting jobs for 10 minutes — worker stalled or under-provisioned."

      - alert: CrmRowCountsWithheld
        # #3195 retired `NoTasksPending` (expr: nucrm_tasks_pending_total == 0,
        # "All tasks completed"). That series was a permanent zero: /api/metrics
        # counted contacts/leads/deals/companies/tasks/activities/users on the
        # bare pool, every one of those tables is guarded by tenant_isolation,
        # and 0039 made the policy fail CLOSED — so the rule was true on every
        # scrape of every tenant, forever, which is #2542's "no alert has ever
        # been delivered" from the opposite side. The gauge is gone rather than
        # left lying, so the rule that can actually fire is the one about the
        # hole it left: the scrape exports no CRM row counts at all until
        # #3102/#3195 settles the aggregate-privilege question.
        expr: nucrm_crm_counts_exported == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "CRM row counts are absent from /api/metrics"
          description: "The scrape reports nucrm_crm_counts_exported == 0 — tenant-keyed CRM totals are withheld because no shipped RLS privilege can read them fleet-wide (#3195, #3102). Panels on those series will show No data, not zero."

  - name: nucrm-infra
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL exporter has been unreachable for over 1 minute."

      - alert: PostgresHighConnections
        expr: nucrm_db_active_connections / nucrm_db_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80%"
          description: "Active DB connections have exceeded 80% of the maximum for 5 minutes."

      - alert: PostgresHighWaitingQueries
        expr: nucrm_db_waiting_queries > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL waiting queries > 5"
          description: "More than 5 queries are waiting for a connection pool slot."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis exporter has been unreachable for over 1 minute."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 90%"
          description: "Redis memory usage has exceeded 90% of max memory."

      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 90%"
          description: "Server CPU usage has exceeded 90% for 10 minutes."

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory > 90%"
          description: "Server memory usage has exceeded 90% for 5 minutes."

      # PP-033: this rule existed with `> 90` and stayed silent while the root
      # filesystem filled to 84% (79 GB free). 90% was never a usable warning
      # level here: a single `docker compose build app` writes ~10 GB of BuildKit
      # cache, so the gap between "warn" and "the build fails mid-layer" was
      # smaller than one build. Two tiers now — react at 80, page at 90.
      # NOTE: `docker system df` under-reports this cache on the containerd
      # snapshotter (it said 0B reclaimable while `docker buildx du` said 114.9GB).
      - alert: HostDiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk > 80% full"
          description: "Root filesystem usage has exceeded 80% for 15 minutes. Measure with `docker buildx du` — BuildKit cache in /var/lib/containerd is the usual cause on this host, and `docker system df` reports it as 0B reclaimable. The host timer nucrm-builder-prune.timer caps it at 40GB daily."

      - alert: HostDiskCritical
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk > 90% full"
          description: "Root filesystem usage has exceeded 90%. Postgres, Prometheus TSDB and deploys all fail on a full root disk; prune the builder cache before it gets here."

  # #3257 — the monitoring plane's own health, and the dependency probes.
  #
  # The failure this group exists for is a silent one: when the blackbox
  # exporter dies, `probe_success` stops being exported. There is no `0` to
  # alert on, every panel shows "No data", and the absence reads as "nothing
  # wrong" on exactly the dashboards that are supposed to notice. So one rule
  # watches the exporter and another fires on the probes going missing, rather
  # than only on a probe that fails.
  - name: nucrm-observability
    rules:
      - alert: BlackboxExporterDown
        expr: up{job="blackbox-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox exporter is DOWN"
          description: 'up{job="blackbox-exporter"} has been 0 for 2 minutes. Every Postgres/Redis/S3 probe is now dark — the failure looks like ''no data'', not like an outage, so this is the rule that has to fire first.'

      - alert: DependencyProbeFailing
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is unreachable (probe failed)"
          description: "The blackbox probe against {{ $labels.instance }} ({{ $labels.service }}) has failed for 2 minutes. This is a connect/answer failure, not a metrics gap: the exporter is up and says the dependency cannot be opened."

      - alert: DependencyProbesMissing
        expr: absent(probe_success)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No dependency probes are being recorded"
          description: "probe_success is absent for 10 minutes — the blackbox scrape job or its config is missing, not merely failing. Without it a dead Postgres/Redis/S3 endpoint produces no alert at all."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is DOWN"
          description: 'up{job="alertmanager"} has been 0 for 5 minutes. Prometheus may still evaluate rules, but no alert leaves the box.'

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rejected its last config reload"
          description: "The running config is the previous one; a scrape job or rule added since the reload is not active. Check `promtool check config` and the Prometheus log."

      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule evaluation is failing"
          description: "One or more rule groups failed to evaluate in the last 15 minutes. An unevaluated alert cannot fire, so this is the monitoring plane's equivalent of a silent test failure."

      - alert: PrometheusSelfScrapeMissing
        expr: absent(up{job="prometheus"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus is not scraping itself"
          description: 'up{job="prometheus"} is absent — the self-scrape job or its target was removed. Prometheus cannot alert on its own death, but an external scraper and Grafana rely on this series to tell ''healthy'' from ''gone''.'
