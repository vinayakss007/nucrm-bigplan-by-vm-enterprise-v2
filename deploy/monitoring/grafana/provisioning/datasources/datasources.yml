apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: nucrm
    user: nucrm
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      # sslmode=disable is intentional here and ONLY safe because Grafana reaches
      # Postgres over the isolated internal Docker network (nucrm-net) — this
      # connection never leaves the host and is not exposed publicly (#1474).
      # The application's own DATABASE_URL must still use sslmode=require in prod.
      # If Postgres is ever moved off the private network, change this to require.
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 3600
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: requestId
          type: field
          matcherRegex: '\[([^\]]+)\]'
          url: ""
          urlDisplayLabel: "Request ID"
