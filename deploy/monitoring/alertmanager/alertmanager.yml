---
route:
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical-log
      group_wait: 10s
    - match:
        severity: warning
      receiver: warning-log

receivers:
  - name: default
  - name: critical-log
    webhook_configs:
      - url: "http://host.docker.internal:9095/webhook"
        send_resolved: true
  - name: warning-log
    webhook_configs:
      - url: "http://host.docker.internal:9095/webhook"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
