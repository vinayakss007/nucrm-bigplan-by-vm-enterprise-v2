# PostgreSQL 16 — host-based authentication, the deployment-owned copy. #3265
#
# Before this file, the only pg_hba in a NuCRM install was whatever initdb or the
# distribution packaging wrote into the data directory. Provision a new volume, or
# restore a backup onto one, and Postgres comes up on the image default: `trust`
# for local connections, so the unix socket needs no password from any process on
# the box — and nothing in the boot path notices the downgrade, because the hardening
# it would notice lives inside the very volume that just replaced it. Authentication
# had become a property of the data directory instead of the deployment.
#
# Two topologies, two correct texts. The difference is TLS, not strictness:
#
#   - Packaged / host install (`scripts/deploy-vm.sh`): `ssl = on`
#     (deploy/postgres/postgresql.conf), so the app role's non-loopback rules are
#     `hostssl`. A rule that merely *allows* TLS is the hole #3381 was filed about —
#     node-postgres negotiates a plaintext session against a server that would have
#     accepted one, and every pool downstream looks healthy.
#   - Containerized (`docker-compose.yml`, `docker-compose.scale.yml`): the image
#     starts with `ssl = off` and no certificate exists, so `hostssl` there refuses
#     every application connection at the handshake. Those services pin the auth
#     method at `initdb` instead (POSTGRES_INITDB_ARGS), which is the mechanism the
#     image provides for exactly this, and `npm run guard:pg-hba` screens both
#     halves. TLS on that topology is the client's decision — see lib/db/ssl-config.ts.
#
# `md5` and cleartext `password` appear nowhere on purpose. md5 is still accepted for
# legacy verifiers and is offline-crackable; `password` sends the verifier in the clear.
# Loopback keeps `host` rather than `hostssl`: the interface is not the exposure (the
# published-ports screen, `npm run guard:compose-ports`, is), and an operator's
# `psql -h localhost` must still answer. The credential requirement is unconditional.
#
# Install — a reload picks this up, no restart, so the running pool is not dropped:
#   sudo install -m 600 -o postgres -g postgres \
#     deploy/postgres/pg_hba.conf /var/lib/postgresql/16/main/pg_hba.conf
#   sudo -u postgres psql -c 'select pg_reload_conf()'
# Then prove it: `npm run guard:pg-hba --live`, which reads the *server's* rules, not
# this text — a file that is installed but not reloaded is the failure mode to catch.
#
# Rule order is significant: Postgres takes the FIRST match, so an open `host` line
# later in the file does not widen what an earlier `hostssl` line already decided,
# but an earlier `trust` line would silently win over everything below it.

# TYPE     DATABASE  USER         ADDRESS          METHOD
local      all       postgres                      peer
local      all       all                           scram-sha-256

host       all       all          127.0.0.1/32     scram-sha-256
host       all       all          ::1/128          scram-sha-256

# The application role, over TLS, from anywhere: the only non-loopback admission.
hostssl    nucrm     nucrm_app    0.0.0.0/0        scram-sha-256
hostssl    nucrm     nucrm_app    ::/0             scram-sha-256

# No network admission for the superuser, and none for replication: this file has no
# line for either, so both fail closed rather than falling back to a wider rule.
