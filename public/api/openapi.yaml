  # ── Import/Export ──
  /contacts/import:
    post:
      tags: [Contacts]
      summary: Import contacts from CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: CSV data string
                skipDuplicates:
                  type: boolean
                  default: true
                updateExisting:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  results:
                    type: object
                    properties:
                      imported:
                        type: integer
                      updated:
                        type: integer
                      skipped:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string

  /contacts/export:
    get:
      tags: [Contacts]
      summary: Export contacts as CSV
      responses:
        '200':
          description: CSV file
          content:
